name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_NAME: SwiftProxy
      BUNDLE_ID: com.taegun.swiftproxy
      SCHEME: SwiftProxy
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -iE 'iphoneos|iphonesimulator'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def ver(key):
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted((k for k in data if "iOS" in k), key=ver, reverse=True):
              phones = [d for d in data[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"], file=sys.stdout)
                  print(runtime, phones[0]["name"], file=sys.stderr)
                  break
          ')
          test -n "$UDID" || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Archive (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          ls -la "build/$APP_NAME.xcarchive/Products/Applications/"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH" || { echo "::error::archive does not contain $APP_NAME.app"; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry "../$APP_NAME-unsigned.ipa" Payload)

      - name: Verify IPA structure
        run: bash scripts/verify_ipa.sh "build/$APP_NAME-unsigned.ipa" "$BUNDLE_ID" "$APP_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: build/${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
